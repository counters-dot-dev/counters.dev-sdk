name: sdk-typescript-publish

# Publishes the TypeScript SDK (@counters.dev/sdk) to npm on a release tag like `ts-v0.1.0`.
# Authentication is npm trusted publishing (OIDC) — there is no npm token. The publish job
# exchanges a short-lived GitHub OIDC token for publish rights, which npm grants only to the
# repository and workflow filename registered as the package's trusted publisher. Changing this
# file's NAME therefore breaks publishing until the trusted publisher is updated to match.
# Release tags are packaged without any credential first; the publish job only uploads the
# tarball the package job built.
on:
  push:
    tags: ["ts-v*"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["typescript/package.json", ".github/workflows/sdk-typescript-publish.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: typescript

jobs:
  dry-run:
    if: (github.event_name != 'push') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Example app - compile against the packaged surface
        shell: bash
        working-directory: typescript
        run: |
          npm ci
          npm run build
          cd examples/e2e
          npm install --no-fund --no-audit
          node --check main.mjs
      - name: Publish dry-run (pack only, no upload)
        run: npm publish --dry-run --access public

  package:
    if: startsWith(github.ref, 'refs/tags/ts-v')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag source
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD^{commit})"
          if ! [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid release source sha: $source_sha" >&2
            exit 1
          fi
          git show-ref --verify --quiet refs/remotes/origin/main
          git merge-base --is-ancestor "$source_sha" origin/main
      - name: Validate release tag version
        shell: bash
        # `npm pack` takes its version from package.json and ignores the tag entirely, so a tag
        # that disagrees would quietly publish the wrong version — and npm versions are immutable.
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#ts-v}"
          declared="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME asks for $tag_version, typescript/package.json declares $declared" >&2
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Example app - compile against the packaged surface
        shell: bash
        working-directory: typescript
        run: |
          npm ci
          npm run build
          cd examples/e2e
          npm install --no-fund --no-audit
          node --check main.mjs
      - name: Pack release tarball
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-typescript-package
          path: typescript/artifacts/*.tgz
          if-no-files-found: error

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/ts-v')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      id-token: write # mint the OIDC token npm exchanges for publish rights
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdk-typescript-package
          path: artifacts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm to a version that speaks OIDC
        working-directory: .
        # Trusted publishing needs npm >= 11.5.1. Node 22 ships npm 10.x, so the bundled one
        # cannot do this no matter which Node 22.x setup-node resolves.
        run: |
          set -euo pipefail
          npm install -g npm@latest
          echo "npm $(npm --version) / node $(node --version)"
      - name: Publish downloaded tarball to npm
        working-directory: .
        # The leading `./` is load-bearing. `npm publish artifacts/foo.tgz` is parsed as npm's
        # GitHub `owner/repo` shorthand, so npm tries to clone `github.com/artifacts/foo.tgz`
        # instead of publishing the file. Resolving the glob first also turns "no tarball" or
        # "more than one tarball" into a clear failure rather than a confusing npm error.
        run: |
          set -euo pipefail
          tarball="$(echo ./artifacts/*.tgz)"
          if [ ! -f "$tarball" ]; then
            echo "expected exactly one tarball in ./artifacts, found: $(echo ./artifacts/*)" >&2
            exit 1
          fi
          echo "publishing $tarball"
          npm publish "$tarball" --access public
        env:
          # Provenance is generated automatically under trusted publishing, but npm refuses to
          # attest a package whose source repository is private — provenance from private repos
          # has been unsupported since 2023. Drop this line when counters.dev-sdk goes public;
          # provenance is worth having and costs nothing once the repo is visible.
          NPM_CONFIG_PROVENANCE: "false"
