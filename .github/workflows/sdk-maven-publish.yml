name: sdk-maven-publish

# Publishes the Java SDK (`dev.counters:counters-sdk`) to Maven Central via the Central Portal on
# release tags `java-v*`.
# Publishing is currently ON HOLD — no release tag is pushed yet, and Maven Central namespace
# verification for `dev.counters` is a prerequisite. Release tags build and test the Maven
# repository layout without credentials first; the credentialed job signs that downloaded layout
# and uploads a Central Portal bundle without running Gradle.
# The upload is AUTOMATIC: Central validates the bundle and, if it passes, publishes it without
# a human step. That is safe because validation still gates it — a bundle with a bad signature,
# an unverified namespace or an incomplete POM is rejected rather than published. It was
# USER_MANAGED for 0.0.1 and 0.1.0, when the signing and upload legs had never run; both staged
# and validated cleanly, so the manual step was retired.
# What this gives up: there is no longer a look-before-it-is-permanent step. A tag that passes
# validation is live on Maven Central and cannot be unpublished. The tag/version guard below is
# what stands in its place.
on:
  push:
    tags: ["java-v*"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "java/build.gradle.kts"
      - ".github/workflows/sdk-maven-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    if: (github.event_name != 'push') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          validate-wrappers: true
      - name: Test
        working-directory: java
        run: ./gradlew --no-daemon test
      - name: Publish to Maven local (dry-run — no upload, no signing)
        working-directory: java
        run: ./gradlew --no-daemon publishToMavenLocal

  package:
    if: startsWith(github.ref, 'refs/tags/java-v')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag source
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD^{commit})"
          if ! [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid release source sha: $source_sha" >&2
            exit 1
          fi
          git show-ref --verify --quiet refs/remotes/origin/main
          git merge-base --is-ancestor "$source_sha" origin/main
      - name: Validate release tag version
        id: version
        shell: bash
        # The tag names the release; build.gradle.kts names the artifact. If they disagree, the
        # bundle below would carry a version nobody asked for — and Maven Central is immutable,
        # so a wrong publish cannot be taken back. Fail here, before any credential is touched.
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#java-v}"
          declared="$(sed -nE 's/^version = "(.+)"$/\1/p' java/build.gradle.kts)"
          if [ -z "$declared" ]; then
            echo "could not read version from java/build.gradle.kts" >&2
            exit 1
          fi
          if [ "$tag_version" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME asks for $tag_version, java/build.gradle.kts declares $declared" >&2
            exit 1
          fi
          echo "version=$declared" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          validate-wrappers: true
      - name: Test
        working-directory: java
        run: ./gradlew --no-daemon test
      - name: Build Maven local artifact layout
        working-directory: java
        run: ./gradlew --no-daemon publishToMavenLocal
      - name: Stage Maven repository layout
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          artifact_path="dev/counters/counters-sdk/$VERSION"
          mkdir -p "maven-bundle/$(dirname "$artifact_path")"
          cp -R "$HOME/.m2/repository/$artifact_path" "maven-bundle/$artifact_path"
          find maven-bundle -type f -print | sort
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-maven-package
          path: maven-bundle/**
          if-no-files-found: error

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/java-v')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdk-maven-package
          path: maven-bundle
      - name: Sign downloaded Maven artifacts and upload Central Portal bundle
        shell: bash
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zip

          printf '%s' "$SIGNING_KEY" | gpg --batch --import
          find maven-bundle -type f ! -name '*.asc' ! -name '*.md5' ! -name '*.sha1' -print0 |
            while IFS= read -r -d '' file; do
              gpg --batch --yes --pinentry-mode loopback \
                --passphrase "$SIGNING_PASSWORD" \
                --armor --detach-sign "$file"
            done

          find maven-bundle -type f ! -name '*.md5' ! -name '*.sha1' -print0 |
            while IFS= read -r -d '' file; do
              sha1sum "$file" | awk '{print $1}' > "$file.sha1"
              md5sum "$file" | awk '{print $1}' > "$file.md5"
            done

          bundle="$RUNNER_TEMP/central-bundle.zip"
          # Zip the `dev` tree by name, not `.`: Central reads the Maven coordinates straight off
          # the entry paths, which must start at the group directory.
          (cd maven-bundle && zip -qr "$bundle" dev)
          auth="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 | tr -d '\n')"
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $auth" \
            --form "bundle=@${bundle}" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=${GITHUB_REF_NAME}&publishingType=AUTOMATIC"
          echo "Uploaded as AUTOMATIC — Central will publish it if validation passes."
          echo "Track it at https://central.sonatype.com/publishing/deployments"
