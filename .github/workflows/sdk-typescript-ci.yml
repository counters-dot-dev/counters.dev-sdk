name: sdk-typescript-ci

# The example apps are COMPILED here, not run: exercising them end-to-end needs a live counters.dev
# service, which lives in a separate (private) repository. Maintainers run the end-to-end suites
# there against a checkout of this repo. Here: unit tests + conformance vectors + build only.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["typescript/**", "conformance/**", "openapi/**", "scripts/ci/**", ".github/workflows/sdk-typescript-ci.yml"]
  push:
    branches: [main]
    paths: ["typescript/**", "conformance/**", "openapi/**", "scripts/ci/**", ".github/workflows/sdk-typescript-ci.yml"]

permissions:
  contents: read
  pull-requests: write # sticky results comment (scripts/ci/pr-comment.sh)

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      summary: ${{ steps.sum.outputs.summary }}
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Metrics — mark start
        if: github.event_name == 'push'
        continue-on-error: true
        shell: bash
        working-directory: .
        run: echo "CI_T0=$(date +%s)" >> "$GITHUB_ENV" || echo "::warning::failed to mark CI metrics start time (ignored)"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Test with coverage (report only, no gate yet)
        shell: bash
        run: npm run test:coverage 2>&1 | tee /tmp/unit.log
      - run: npm run build
      - name: Unit summary
        if: always()
        id: sum
        shell: bash
        run: |
          # test runners force ANSI colors on GitHub Actions; strip them or the greps miss
          if [ -f /tmp/unit.log ]; then
            sed 's/\x1b\[[0-9;]*m//g' /tmp/unit.log > /tmp/unit.txt
            tests_line="$(grep -m1 -E '^[[:space:]]*Tests[[:space:]]+' /tmp/unit.txt || true)"
            passed="$(printf '%s\n' "$tests_line" | sed -nE 's/.*[[:space:]]([0-9]+) passed.*/\1/p')"
            failed="$(printf '%s\n' "$tests_line" | sed -nE 's/.*[[:space:]]([0-9]+) failed.*/\1/p')"
            passed="${passed:-0}"
            failed="${failed:-0}"
          else
            : > /tmp/unit.txt
            tests_line=""
            passed=""
            failed=""
          fi
          coverage_line="$(grep -m1 'All files' /tmp/unit.txt || true)"
          {
            echo 'summary<<EOF_SUMMARY'
            echo "- unit: \`${tests_line:-not available}\`"
            if [ -n "$coverage_line" ]; then
              printf '%s\n' "$coverage_line" \
                | awk -F'|' '{gsub(/ /,"",$2); gsub(/ /,"",$3); gsub(/ /,"",$4); gsub(/ /,"",$5);
                              printf "- coverage: %s%% stmts · %s%% branch · %s%% funcs · %s%% lines\n", $2, $3, $4, $5}'
            else
              echo "- coverage: _not available_"
            fi
            echo 'EOF_SUMMARY'
            if [ -n "${passed}${failed}" ]; then
              echo "passed=$passed"
              echo "failed=$failed"
            fi
          } >> "$GITHUB_OUTPUT"
      - name: Metrics — report to counters.dev
        if: always() && github.event_name == 'push'
        continue-on-error: true
        shell: bash
        working-directory: .
        env:
          COUNTERS_API_KEY: ${{ secrets.COUNTERS_API_KEY }}
          APP: sdk-typescript
          BUILD_OUTCOME: ${{ job.status }}
          PASSED: ${{ steps.sum.outputs.passed }}
          FAILED: ${{ steps.sum.outputs.failed }}
          IDEM_SCOPE: ${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:${{ github.job }}
        run: bash scripts/ci/counters-count.sh

  example:
    # Compile the example apps against the SDK just built. They are deliberately NOT executed: running them
    # requires a live counters.dev service (private repo). This proves the documented example still
    # compiles against the current client surface.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    needs: test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Example apps — compile against the current client surface
        id: app
        shell: bash
        working-directory: typescript
        run: |
          npm ci
          npm run build
          cd examples/e2e
          npm install --no-fund --no-audit
          node --check main.mjs 2>&1 | tee /tmp/example.log
          cd ../nextjs
          npm ci --no-fund --no-audit
          npm run typecheck 2>&1 | tee -a /tmp/example.log
      - name: PR comment (results)
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          UNIT_SUMMARY: ${{ needs.test.outputs.summary }}
          EXAMPLE_OUTCOME: ${{ steps.app.outcome }}
        run: |
          {
            [ "$EXAMPLE_OUTCOME" = "success" ] && echo "### ✅ sdk-typescript" || echo "### ❌ sdk-typescript"
            printf '%s\n' "$UNIT_SUMMARY"
            if [ "$EXAMPLE_OUTCOME" = "success" ]; then
              echo "- example apps: compile"
            else
              echo "- example apps: **$EXAMPLE_OUTCOME**"
              echo '```'
              tail -15 /tmp/example.log 2>/dev/null || echo "no output — see the run log"
              echo '```'
            fi
            echo ""
            echo "_[run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_"
          } | bash scripts/ci/pr-comment.sh sdk-typescript-ci
