name: sdk-java-ci

# The example app is COMPILED here, not run: exercising it end-to-end needs a live counters.dev
# service, which lives in a separate (private) repository. Maintainers run the end-to-end suites
# there against a checkout of this repo. Here: unit tests + conformance vectors + build only.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["java/**", "conformance/**", "openapi/**", "scripts/ci/**", ".github/workflows/sdk-java-ci.yml"]
  push:
    branches: [main]
    paths: ["java/**", "conformance/**", "openapi/**", "scripts/ci/**", ".github/workflows/sdk-java-ci.yml"]

permissions:
  contents: read
  pull-requests: write # sticky results comment (scripts/ci/pr-comment.sh)

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      summary: ${{ steps.sum.outputs.summary }}
    defaults:
      run:
        working-directory: java
    steps:
      - name: Metrics — mark start
        if: github.event_name == 'push'
        continue-on-error: true
        shell: bash
        working-directory: .
        run: echo "CI_T0=$(date +%s)" >> "$GITHUB_ENV" || echo "::warning::failed to mark CI metrics start time (ignored)"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          validate-wrappers: true # checked-in wrapper jar — fail the build if it is ever swapped
      - run: ./gradlew --no-daemon test # test is finalized by jacocoTestReport (report only, no gate yet)
      - name: Unit summary
        if: always()
        id: sum
        shell: bash
        run: |
          if [ -d build/test-results/test ]; then
            bash ../scripts/ci/junit-jacoco-summary.sh build/test-results/test build/reports/jacoco/test/jacocoTestReport.xml "$GITHUB_OUTPUT" > /tmp/unit-summary.md
          else
            echo "- unit: _no JUnit results produced_" > /tmp/unit-summary.md
          fi
          {
            echo 'summary<<EOF_SUMMARY'
            cat /tmp/unit-summary.md
            echo 'EOF_SUMMARY'
          } >> "$GITHUB_OUTPUT"
      - name: Metrics — report to counters.dev
        if: always() && github.event_name == 'push'
        continue-on-error: true
        shell: bash
        working-directory: .
        env:
          COUNTERS_API_KEY: ${{ secrets.COUNTERS_API_KEY }}
          APP: sdk-java
          BUILD_OUTCOME: ${{ job.status }}
          PASSED: ${{ steps.sum.outputs.passed }}
          FAILED: ${{ steps.sum.outputs.failed }}
          IDEM_SCOPE: ${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:${{ github.job }}
        run: bash scripts/ci/counters-count.sh

  example:
    # Compile the example apps against the SDK just built. They are deliberately NOT executed: running them
    # requires a live counters.dev service (private repo). This proves the documented example still
    # compiles against the current client surface.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    needs: test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          validate-wrappers: true
      - name: Example apps — compile against the current client surface
        id: app
        shell: bash
        # Driven through the SDK's own wrapper: the examples are separate builds that
        # includeBuild("../..") the SDK, so they build with the version java/ pins.
        run: |
          java/gradlew --no-daemon -p java/examples/e2e assemble --console=plain 2>&1 | tee /tmp/example.log
          java/gradlew --no-daemon -p java/examples/raid assemble --console=plain 2>&1 | tee -a /tmp/example.log
      - name: PR comment (results)
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          UNIT_SUMMARY: ${{ needs.test.outputs.summary }}
          EXAMPLE_OUTCOME: ${{ steps.app.outcome }}
        run: |
          {
            [ "$EXAMPLE_OUTCOME" = "success" ] && echo "### ✅ sdk-java" || echo "### ❌ sdk-java"
            printf '%s\n' "$UNIT_SUMMARY"
            if [ "$EXAMPLE_OUTCOME" = "success" ]; then
              echo "- example apps: compile"
            else
              echo "- example apps: **$EXAMPLE_OUTCOME**"
              echo '```'
              tail -15 /tmp/example.log 2>/dev/null || echo "no output — see the run log"
              echo '```'
            fi
            echo ""
            echo "_[run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_"
          } | bash scripts/ci/pr-comment.sh sdk-java-ci
