    get:
      operationId: listMachineAlertRules
      x-api-key-scope: alert:read
      summary: List the organization's alert rules
      description: |
        Keyset-paginated alert rules across counter, member, and derived targets. Filter by
        `counterKey` (a counter key, or a derived key with `targetType=derived`) and/or
        `targetType`. Requires a full-access organization API key with `alert:read` — always
        enforced, regardless of the scope-enforcement rollout mode. Reads are not audited.
      tags: [alerts]
      parameters:
        - name: counterKey
          in: query
          description: Only rules targeting this counter (or derived) key.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: targetType
          in: query
          description: Only rules of this target kind.
          schema: { type: string, enum: [counter, member, derived] }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The rule page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MachineAlertRuleList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
