      tags: [alerts]
      parameters:
        - $ref: '#/components/parameters/MachineIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MachineCreateAlertRuleRequest' }
      responses:
        '201':
          description: The created rule.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MachineAlertRule' }
        '200':
          description: |
            Idempotent replay: the same `Idempotency-Key` with a byte-identical body returns the
            recorded rule instead of creating a second one.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MachineAlertRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /alerts/{ruleId}:
    servers:
      - url: https://hub.counters.dev/v1
        description: Machine surface lives on the hub host; data-plane /v1 stays on api.counters.dev.
    parameters:
      - name: ruleId
        in: path
        required: true
        description: Alert rule id.
        schema: { type: string, format: uuid }
    get:
      operationId: getMachineAlertRule
      x-api-key-scope: alert:read
      summary: Get one alert rule
      description: |
        Fetches a single alert rule by id. A peer organization's id is a 404, never a leak. Requires
        a full-access organization API key with `alert:read` — always enforced. Reads are not audited.
      tags: [alerts]
      responses:
        '200':
          description: The rule.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MachineAlertRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
