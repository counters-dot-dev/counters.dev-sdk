    put:
      operationId: updateMachineAlertRule
      x-api-key-scope: alert:write
      summary: Update an alert rule
      description: |
        Partial update; kind, counter key, and target are immutable (delete and recreate to change
        them). Reminder semantics are tri-state: omit `reminderIntervalSeconds` to leave it unchanged,
        send null to turn reminders off, send a value to set it. Requires a full-access organization
        API key with `alert:write` — always enforced. Audited as the `api_key` actor
        (`alert_rule.updated`).
      tags: [alerts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MachineUpdateAlertRuleRequest' }
      responses:
        '200':
          description: The updated rule.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MachineAlertRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      operationId: deleteMachineAlertRule
      x-api-key-scope: alert:manage
      summary: Delete an alert rule
      description: |
        Deletes one alert rule. Requires a full-access organization API key with `alert:manage` —
        always enforced. Audited as the `api_key` actor (`alert_rule.deleted`).
      tags: [alerts]
      responses:
        '204': { description: Deleted. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /alerts/incidents/{incidentId}/ack:
    servers:
      - url: https://hub.counters.dev/v1
        description: Machine surface lives on the hub host; data-plane /v1 stays on api.counters.dev.
    parameters:
      - name: incidentId
        in: path
        required: true
        description: Alert incident id.
        schema: { type: string, format: uuid }
    post:
      operationId: acknowledgeMachineAlertIncident
      x-api-key-scope: alert:write
      summary: Acknowledge an alert incident
      description: |
        Marks an open incident acknowledged ("seen, stop reminding") without resolving it. Idempotent:
        re-acking a still-open incident returns it unchanged; a resolved incident is rejected (400 on
        local composition, 409 on a split hub where the plane reports it). Requires a
        full-access organization API key with `alert:write` — always enforced. The `reason` is required
        free text for the audit trail; there is no confirmation word. `Idempotency-Key` is required and
        correlates the acknowledgement. Audited as the `api_key` actor (`alert.acknowledged`). On a
        split hub the acknowledgement travels as a signed hub-to-plane management command and may
        answer `202` (pending) instead of `200`.
      tags: [alerts]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Lowercase UUID correlating this acknowledgement.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MachineAckRequest' }
      responses:
        '200':
          description: The acknowledged incident.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MachineAlertIncident' }
        '202':
          description: Accepted on a split hub; poll the incident until acknowledged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MachineCommandPending' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

