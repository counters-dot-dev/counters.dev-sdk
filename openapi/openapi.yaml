  /keys:
    servers:
      - url: https://hub.counters.dev/v1
        description: Machine surface lives on the hub host; data-plane /v1 stays on api.counters.dev.
    post:
      operationId: mintMachineApiKey
      x-api-key-scope: key:mint
      summary: Mint a scoped organization API key
      description: |
        Mints a new organization API key owned by the caller's organization — the delegation
        primitive for handing a narrower key to a sub-agent. Requires a full-access organization
        API key with `key:mint` — always enforced, regardless of the scope-enforcement rollout
        mode. No escalation: every requested scope must already be on the calling key (a superset
        request is `403` with problem `type: "scope_denied"` and a `disallowed` member naming each
        requested scope outside the caller's set). An `expiresAt` later than the calling key's own
        expiry is rejected with `400` (never silently clamped); a caller that never expires may
        mint any future expiry or none (when the calling key has an expiry, omitting `expiresAt`
        or passing null is rejected with `400`). The response carries the new key's secret exactly once —
        an idempotent replay (`200`, same `Idempotency-Key` with a byte-identical body) returns
        the recorded metadata with `secret` null. The minting key's id is stored as
        `createdByKeyId` lineage; revoking the minting key does NOT cascade to keys it minted.
        Audited as the `api_key` actor (`api_key.created`).
      tags: [keys]
      parameters:
        - $ref: '#/components/parameters/MachineIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MachineMintKeyRequest' }
      responses:
        '201':
          description: The minted key, with its secret (shown exactly once).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MachineMintKeyResponse' }
        '200':
          description: |
            Idempotent replay: the same `Idempotency-Key` with a byte-identical body returns the
            recorded key metadata with `secret` null instead of minting a second key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MachineMintKeyResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            Missing `key:mint` (a `scope_denied` problem naming it in `required`), or a superset
            request (a `scope_denied` problem naming each out-of-reach scope in `disallowed`).
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Problem'
                  - $ref: '#/components/schemas/KeyMintDeniedProblem'
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /keys/self:
    servers:
      - url: https://hub.counters.dev/v1
        description: Machine surface lives on the hub host; data-plane /v1 stays on api.counters.dev.
    delete:
      operationId: revokeOwnMachineApiKey
      summary: Revoke the calling API key (self-destruct)
      description: |
        Revokes exactly the calling organization API key — the end-of-work primitive for an agent
        handed a key by a human: when the work is done, call this and the key dies with it. Needs
        no scope: any valid organization API key may destroy itself. The response is `204`; the
        key's next request on any surface (hub and data plane) is `401`, and a second call with
        the revoked key is `401`. Revocation is durable in the hub row at once; the data plane
        stops accepting the key once it applies the published credential snapshot (poke-driven,
        polling fallback — up to a minute in the worst case). Audited as the `api_key` actor
        (`api_key.revoked`).
      tags: [keys]
      responses:
        '204': { description: Revoked. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /public/counters/{counterKey}/value:
    servers:
      - url: https://api.counters.dev
        description: Public demo endpoints live at the API origin root, not under /v1.
    parameters:
      - $ref: '#/components/parameters/CounterKey'
    get:
      operationId: getPublicCounterValue
      summary: Read a public demo counter (key-less)
      security: []
      tags: [public]
      description: |
        Current value of an allowlisted public counter — no auth, callable straight from a browser.
        Responses carry `Access-Control-Allow-Origin: *` and `Cache-Control: public, max-age=2,
        stale-while-revalidate=5`, so a CDN in front of the origin absorbs polling fan-out. An
        allowlisted counter that has never been written reads as `"0"` (epoch 0), never 404. A key
        outside the allowlist — or an operator that hasn't configured the feature — is a plain 404.
        `OPTIONS` preflight is supported (methods `GET, POST, OPTIONS`; headers `Content-Type`).
      responses:
        '200':
          description: The current value.
          headers:
            Cache-Control:
              description: '`public, max-age=2, stale-while-revalidate=5` — short shared-cache TTL for CDN absorption.'
              schema: { type: string }
            Access-Control-Allow-Origin:
              description: Always `*` on this endpoint.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValueResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /public/counters/{counterKey}/tap:
    servers:
      - url: https://api.counters.dev
        description: Public demo endpoints live at the API origin root, not under /v1.
    parameters:
      - $ref: '#/components/parameters/CounterKey'
    post:
      operationId: tapPublicCounter
      summary: Tap a public demo counter (+1, key-less)
      security: []
      tags: [public]
      description: |
        Adds exactly **+1** to an allowlisted public counter — the amount is fixed server-side and no
        request body is accepted. Deliberately **not idempotent**: every accepted tap counts, and the
        per-IP + global rate limits (429 with `Retry-After` beyond them) are the abuse control. Returns
        the post-increment value so clients can render the click instantly. Responses carry
        `Access-Control-Allow-Origin: *` and `Cache-Control: no-store`. `OPTIONS` preflight is
        supported (methods `GET, POST, OPTIONS`; headers `Content-Type`).
      responses:
        '200':
          description: Applied; the post-increment value.
          headers:
            Cache-Control:
              description: Always `no-store` — tap responses are never cached.
              schema: { type: string }
            Access-Control-Allow-Origin:
              description: Always `*` on this endpoint.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValueResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: Organization API key. Verified locally; never round-trips to WorkOS on the request hot path.
    workOs:
      type: http
      scheme: bearer
      description: WorkOS AuthKit access token for dashboard hub endpoints.
    dashboardReadToken:
      type: http
      scheme: bearer
      bearerFormat: dt_
      description: |
        Short-lived `dt_` dashboard read token minted by the hub and verified locally by the assigned
        data plane. Production planes bind the token org through their committed core projection snapshot
        before serving core dashboard reads.

  parameters:
    CounterKey:
      name: counterKey
      in: path
      required: true
      description: Counter identifier, unique within the organization (e.g. "registrations").
      schema: { type: string, minLength: 1, maxLength: 200, pattern: '^[A-Za-z0-9._:-]+$' }
    DerivedKey:
      name: derivedKey
      in: path
      required: true
      description: Derived-counter identifier, unique within the organization (separate namespace from counter keys).
      schema: { type: string, minLength: 1, maxLength: 200, pattern: '^[A-Za-z0-9._:-]+$' }
    BoardId:
      name: boardId
      in: path
      required: true
      description: Board identifier (server-minted UUID).
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Client-supplied key for effectively-once writes. The SDKs send a fresh key on every write; a batch carries
        one key per operation, not one key for the HTTP request. The guaranteed deduplication window is six hours:
        retrying the same operation with the same key during that window replays its original result. Keys older than
        six hours are eligible for pruning, so reusing one later may execute a new operation. Reusing a live key for a
        different operation returns `409 Conflict`.

        Each organization also has a plan-derived live-key cap, defaulted to 110% of the maximum writes its enforced
        rate limit permits during six hours. Traffic within that rate limit cannot exhaust the cap. If the cap is
        exhausted, a standalone write returns `403 Forbidden`; a batch reports an `error` result with status `403` for
        that operation. No `Retry-After` header is sent because the service does not promise an exact recovery time.
        Do not retry automatically; retry only after older keys have left the six-hour window.
      schema: { type: string, maxLength: 255 }
    MachineIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Lowercase RFC 4122 UUID (versions 1-5) for effectively-once machine creates. Retrying a create with the same key
        and a byte-identical body replays the recorded rule/definition (`200`) instead of creating
        a second one; the same key with a different body (or a different machine operation) is
        `409 Conflict`. If the resource the key originally created has since been deleted (or, for a
        derived definition, changed), the replay is `409` with problem type `idempotency_key_reused`
        and creates nothing. Optional on creates; required on incident acknowledgement, where it
        correlates the acknowledgement.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    Cursor:
      name: cursor
      in: query
      description: Opaque pagination cursor from a previous response.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    MemberKey:
      name: member
      in: path
      required: true
      description: Member identifier within a counter's board (e.g. "playerX", or a composite "alice|bob").
      schema: { type: string, minLength: 1, maxLength: 256, pattern: '^[A-Za-z0-9._:@|-]+$' }
    Epoch:
      name: epoch
      in: query
      description: Season to read; defaults to the counter's current epoch. Past seasons stay readable after clear.
      schema: { type: integer, format: int64 }
    MemberSeriesTop:
      name: top
      in: query
      description: >-
        With `groupBy=member`, select the top N members over the requested range. Ranking follows
        board semantics: range sum for `sum`, range minimum for `min`, range maximum for `max`,
        and the newest submitted value for `latest`. N must not exceed the organization's resolved
        `maxMembersWithSeries` entitlement. The absolute response budget is 25,000 points, so
        `top * bucketCount` (plus one series when `other=true`) must fit; reduce `top` or use a
        coarser bucket when it does not. Requires `groupBy=member`.
      schema: { type: integer, minimum: 1 }
    MemberSeriesOther:
      name: other
      in: query
      description: >-
        With `groupBy=member&top=N` on a sum board, append a synthetic `$other` series containing
        the per-bucket sum of all omitted members. Defaults to false. `other=true` is rejected on
        `min`, `max`, and `latest` boards because a combined score series has no coherent meaning.
      schema: { type: boolean, default: false }

  schemas:
    Amount:
      type: string
      pattern: '^[0-9]+$'
      description: Non-negative integer magnitude, arbitrary precision, as a decimal-digit string.
      examples: ['1', '42', '100000000000000000000000']
    Value:
      type: string
      pattern: '^-?[0-9]+$'
      description: Signed integer counter value, arbitrary precision, as a string.
      examples: ['0', '-5', '999999999999999999999999999']
    AmountRequest:
      type: object
      required: [amount]
      properties:
        amount: { $ref: '#/components/schemas/Amount' }
        occurredAt:
          type: string
          format: date-time
          description: |
            Optional event time. When set, the operation is bucketed into the time series at this
            instant instead of ingest time (for offline spools flushing late). Bounded: at most 5
            minutes in the future and no older than the plan's retention window (400 otherwise).
            Totals are unaffected — only series bucketing.
    UndeclaredCounterWrites:
      type: string
      enum: [allow, reject]
      description: |
        Per-organization implicit-create policy with explicit polarity. `allow` lets ordinary data
        writes create an absent counter (the backwards-compatible default for existing organizations).
        `reject` makes live counter rows the strict-key allowlist: an absent key returns a typed `409`
        until it is created through `POST /counters`. This is an organization safety policy, not a
        plan entitlement or temporary grant.
    CounterWritePolicy:
      type: object
      required: [undeclaredCounterWrites, version, explicit]
      properties:
        undeclaredCounterWrites:
          $ref: '#/components/schemas/UndeclaredCounterWrites'
        version:
          type: integer
          format: int64
          minimum: 0
          description: CAS version. Zero exists only for the implicit policy-row-absent default.
        explicit:
          type: boolean
          description: False only when no policy row exists and implicit `allow` is in effect.
        updatedAt:
          type: string
          format: date-time
          description: Present for an explicitly stored policy.
        updatedBy:
          type: string
          description: API-key actor that most recently changed the explicit policy.
    SetCounterWritePolicyRequest:
      type: object
      required: [undeclaredCounterWrites, expectedVersion]
      properties:
        undeclaredCounterWrites:
          $ref: '#/components/schemas/UndeclaredCounterWrites'
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
          description: Version returned by the latest GET. A stale value returns 409.
    CounterDeclaration:
      type: object
      required: [key]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[A-Za-z0-9._:-]+$'
        memberMode:
          description: >-
            Desired member-board aggregation mode. Omit for an unconfigured scalar counter. A matching
            repeat is a no-op; any mismatch on an existing counter returns an error for this key. The
            mode is immutable once declared, even when the board has no member data.
          allOf:
            - $ref: '#/components/schemas/Mode'
        memberSeriesEnabled:
          type: boolean
          default: false
          description: >-
            Whether per-member time series must be enabled. Enabling during creation happens before any
            member writes and records this API key as the enabling actor.
    DeclareCountersRequest:
      type: object
      required: [counters]
      properties:
        counters:
          type: array
          minItems: 1
          maxItems: 1000
          description: >-
            The client's full known counter set. Duplicate entries become per-key errors. Each bounded
            transaction contains at most 25 keys; callers must inspect every result.
          items: { $ref: '#/components/schemas/CounterDeclaration' }
    CounterDeclarationResult:
      type: object
      required: [key, status]
      properties:
        key: { type: string }
        status:
          type: string
          enum: [created, unchanged, error]
          description: >-
            `unchanged` means the declaration exactly matched and performed no counter/config write;
            `error` means only this key (or its bounded transaction batch) failed.
        epoch: { type: integer, format: int64 }
        memberMode: { $ref: '#/components/schemas/Mode' }
        memberSeriesEnabled: { type: boolean }
        memberSeriesEnabledAt:
          type: string
          format: date-time
          description: >-
            Most recent disabled-to-enabled transition; absent until first enabled. When the actor has
            `unknown:*` provenance, this is a migration or rolling-upgrade fallback timestamp rather
            than the historical enable time.
        memberSeriesEnabledBy:
          type: string
          description: >-
            Actor responsible for `memberSeriesEnabledAt`; absent until first enabled. Normally
            `api_key:<uuid>` or `user:<id>`; `unknown:pre-audit` and `unknown:rolling-upgrade` are honest
            compatibility sentinels.
        memberCount:
          type: integer
          minimum: 0
          description: Current-epoch member count at declaration time.
        error:
          allOf:
            - $ref: '#/components/schemas/Problem'
          description: Present when status is `error`; includes an HTTP-style status and reason.
    DeclareCountersResponse:
      type: object
      required: [results, policy]
      properties:
        results:
          type: array
          description: One result per declaration, in request order.
          items: { $ref: '#/components/schemas/CounterDeclarationResult' }
        policy:
          $ref: '#/components/schemas/CounterWritePolicy'
    Counter:
      type: object
      required: [key, value, epoch]
      properties:
        key: { type: string }
        value: { $ref: '#/components/schemas/Value' }
        epoch:
          type: integer
          description: Incremented by clear; the value sums deltas in the current epoch.
        memberMode:
          description: Board aggregation mode; present on the full-access counter detail read when configured.
          allOf:
            - $ref: '#/components/schemas/Mode'
        memberSeriesEnabled:
          type: boolean
          description: Present on the full-access counter detail read.
        memberSeriesEnabledAt:
          type: string
          format: date-time
          description: >-
            Most recent disabled-to-enabled transition; present on the full-access detail read after
            member series has first been enabled and retained across disable. With an `unknown:*`
            actor, this is a migration or rolling-upgrade fallback timestamp, not the historical enable time.
        memberSeriesEnabledBy:
          type: string
          description: >-
            Actor responsible for `memberSeriesEnabledAt`, e.g. `api_key:<uuid>` or `user:<id>`.
            Compatibility values `unknown:pre-audit` and `unknown:rolling-upgrade` explicitly mean the
            historical actor is unavailable.
        memberCount:
          type: integer
          minimum: 0
          description: Current-epoch member count; present on the full-access counter detail read.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ValueResponse:
      type: object
      required: [key, value, epoch]
      properties:
        key: { type: string }
        value: { $ref: '#/components/schemas/Value' }
        epoch: { type: integer }
    DashboardPlaneToken:
      type: object
      required: [token, plane_base_url, expires_at]
      properties:
        token:
          type: string
          description: Ed25519-signed `dt_` token scoped to one org, one plane, and read-only dashboard access.
        plane_base_url:
          type: string
          format: uri
          description: Origin root for the target data plane.
        expires_at:
          type: string
          format: date-time
          description: Token expiry; at most 10 minutes after issue time.
    DashboardBoardWidget:
      type: object
      required: [id, type, counterKey, size, options]
      description: One BoardV1 widget. Unknown members are rejected, never stored.
      properties:
        id:
          type: string
          maxLength: 200
          description: Widget id, unique within the board.
        type:
          type: string
          enum: [stat, ticker, delta-chart, goal, table]
        counterKey:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[A-Za-z0-9._:-]+$'
          description: Counter key the widget reads (a derived-counter key when `isDerived` is true). Format-validated only; the counter need not exist.
        title:
          type: string
          maxLength: 200
          description: Optional display title.
        size:
          type: string
          enum: [s, m, l]
        options:
          type: object
          description: Widget options; unknown members are rejected, never stored.
          properties:
            format:
              type: string
              maxLength: 200
            bucket:
              type: string
              maxLength: 200
            rangePreset:
              type: string
              maxLength: 200
            target:
              type: string
              maxLength: 1100
              pattern: '^-?[0-9]+(\.[0-9]+)?$'
              description: Goal target as a decimal string.
            limit:
              type: integer
              minimum: 1
              maximum: 1000
              description: Row limit for a table widget.
        isDerived:
          type: boolean
          description: True when `counterKey` names a derived counter.
    DashboardBoard:
      type: object
      required: [version, id, name, createdAt, updatedAt, revision, widgets]
      description: One BoardV1 board plus the revision metadata the optimistic-concurrency protocol needs.
      properties:
        version:
          type: integer
          enum: [1]
        id:
          type: string
          format: uuid
          description: Server-minted board id.
        name:
          type: string
          minLength: 1
          maxLength: 200
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: Last mutation instant.
        revision:
          type: integer
          minimum: 1
          description: Optimistic-concurrency revision, starting at 1. Echo it in `If-Match` on update.
        widgets:
          type: array
          maxItems: 12
          items: { $ref: '#/components/schemas/DashboardBoardWidget' }
    DashboardBoardList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/DashboardBoard' }
    DashboardUsage:
      type: object
      required: [month, opsUsed, opsQuota]
      properties:
        month: { type: string, description: 'UTC month, e.g. "2026-07".' }
        opsUsed: { type: integer, description: Write ops recorded this UTC month. }
        opsQuota:
          type: [integer, 'null']
          description: Monthly op ceiling; null for unlimited plans.
    DashboardEntitlementsUsage:
      type: object
      required: [generatedAt, snapshotVersion, dimensions]
      properties:
        generatedAt:
          type: string
          format: date-time
          description: Timestamp of the applied plane config snapshot used for the entitlement caps.
        snapshotVersion:
          type: integer
          format: int64
          description: Applied plane config snapshot version used for the entitlement caps.
        dimensions:
          type: array
          description: Stable customer-dashboard entitlement dimensions in render order.
          minItems: 5
          maxItems: 5
          items: { $ref: '#/components/schemas/DashboardEntitlementDimension' }
    DashboardEntitlementDimension:
      type: object
      required: [key, usage, usageAvailable, effectiveMax, unlimited, activeBoost]
      properties:
        key:
          type: string
          enum: [counters, monthlyOps, alertChannels, hostedPages, customDomains]
        usage:
          type: [integer, 'null']
          format: int64
          description: Plane-metered usage; null when the plane does not own this dimension's usage table.
        usageAvailable:
          type: boolean
          description: True only when `usage` is a live plane-local count.
        effectiveMax:
          type: [integer, 'null']
          format: int64
          description: Effective post-grant cap from the applied plane config snapshot; null when unlimited.
        unlimited:
          type: boolean
          description: True when the effective cap is the unlimited sentinel and `effectiveMax` is null.
        activeBoost:
          anyOf:
            - $ref: '#/components/schemas/DashboardEntitlementBoost'
            - type: 'null'
          description: Temporary-grant display metadata when a live grant currently raises this dimension.
        windowStart:
          type: string
          format: date-time
          description: UTC usage window start; present for `monthlyOps`.
        windowResetsAt:
          type: string
          format: date-time
          description: UTC usage reset instant; present for `monthlyOps`.
    DashboardEntitlementBoost:
      type: object
      required: [delta, expiresAt]
      properties:
        delta:
          type: integer
          format: int64
          minimum: 1
          description: Amount by which the live temporary grant raises the effective max above baseline.
        expiresAt:
          type: string
          format: date-time
          description: Expiry of the grant currently holding the displayed cap.
    CounterPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Counter' }
        nextCursor:
          type: string
          description: Present when more results exist.
    SeriesResponse:
      type: object
      required: [counterKey, bucket, mode, range, points]
      properties:
        counterKey: { type: string }
        bucket: { type: string }
        mode: { type: string, enum: [delta] }
        tz: { type: string }
        range:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        points:
          type: array
          items: { $ref: '#/components/schemas/SeriesPoint' }
    SeriesPoint:
      type: object
      required: [t, v]
      properties:
        t: { type: string, format: date-time, description: Bucket start (inclusive). }
        v: { $ref: '#/components/schemas/Value' }
    DecimalValue:
      type: string
      nullable: true
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
      description: |
        Signed decimal value, arbitrary precision, as a string (e.g. a ratio). `null` when the
        expression divided by zero. Distinct from `Value`, which is integer-only.
      examples: ['0', '0.052337', '-3.5']
    DerivedValueResponse:
      type: object
      required: [key, value, scale, inputs]
      properties:
        key: { type: string }
        value: { $ref: '#/components/schemas/DecimalValue' }
        scale:
          type: integer
          description: Decimal places the value is rounded to (HALF_UP), fixed per definition.
        inputs:
          type: object
          additionalProperties: { $ref: '#/components/schemas/Value' }
          description: Each referenced counter's current value (integer string); a missing/deleted counter reads as "0".
        reason:
          type: string
          description: Present only when `value` is null (e.g. "division by zero").
    DerivedPreviewRequest:
      type: object
      required: [expression]
      properties:
        expression:
          type: string
          maxLength: 500
        scale:
          type: integer
          minimum: 0
          maximum: 20
          default: 6
    DerivedSeriesPoint:
      type: object
      required: [t, v]
      properties:
        t: { type: string, format: date-time, description: Bucket start (inclusive). }
        v: { $ref: '#/components/schemas/DecimalValue' }
    DerivedSeriesResponse:
      type: object
      required: [key, bucket, scale, range, points]
      properties:
        key: { type: string }
        bucket: { type: string }
        tz: { type: string }
        scale: { type: integer }
        range:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        points:
          type: array
          items: { $ref: '#/components/schemas/DerivedSeriesPoint' }
    Operation:
      type: object
      required: [counterKey, op]
      description: |
        `amount` is required for add/subtract and ignored for clear/delete. When `member` is set, an
        add/subtract becomes a delta member write and delete becomes a member removal. `op: submit`
        requires `member` and `value` and targets an already-configured score board.
      properties:
        counterKey: { type: string }
        op: { type: string, enum: [add, subtract, clear, delete, submit] }
        amount: { $ref: '#/components/schemas/Amount' }
        member:
          type: string
          maxLength: 256
          pattern: '^[A-Za-z0-9._:@|-]+$'
          description: Member key; turns the op into a member-attributed write.
        metadata: { $ref: '#/components/schemas/Metadata' }
        value: { $ref: '#/components/schemas/Value' }
        idempotencyKey: { type: string, maxLength: 255 }
        occurredAt:
          type: string
          format: date-time
          description: Optional event time for series bucketing (see AmountRequest.occurredAt).
    BatchRequest:
      type: object
      required: [operations]
      properties:
        operations:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: '#/components/schemas/Operation' }
    BatchResult:
      type: object
      required: [counterKey, status]
      properties:
        counterKey: { type: string }
        status: { type: string, enum: [applied, deduplicated, error] }
        value: { $ref: '#/components/schemas/Value' }
        error: { $ref: '#/components/schemas/Problem' }
        memberValue: { $ref: '#/components/schemas/Value' }
        memberAccepted:
          type: boolean
          description: False when a min/max submit kept the standing best (absent for non-submit ops).
    BatchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/BatchResult' }
    Metadata:
      type: string
      maxLength: 1024
      description: |
        Opaque, client-parsed per-entry payload, stored and returned verbatim. Capped at 1024 UTF-8
        bytes (the server counts bytes, not characters). Rides accepted values only.
    Mode:
      type: string
      enum: [sum, latest, min, max]
      description: |
        Board aggregation mode. `sum` accumulates deltas (fully counter-integrated); `latest`/`min`/`max`
        submit replace/keep-best scores. Set by the first member write, then immutable.
    CounterMemberSeriesRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        expectedEpoch:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Optional compare-and-set guard. The request fails with 409 if the counter's current epoch
            differs, preventing automation from configuring a board that was concurrently cleared.
    MemberSeriesConfig:
      type: object
      required: [key, enabled, memberCount, maxMembersWithSeries]
      properties:
        key: { type: string }
        enabled: { type: boolean }
        memberCount:
          type: integer
          minimum: 0
          description: Current-epoch member count observed by the toggle.
        maxMembersWithSeries:
          type: integer
          minimum: 0
          description: The calling organization's resolved dimensional-series member cap.
        mode: { $ref: '#/components/schemas/Mode' }
        enabledAt:
          type: string
          format: date-time
          description: Most recent disabled-to-enabled transition; absent until first enabled and retained across disable.
        enabledBy:
          type: string
          description: Actor responsible for `enabledAt`, e.g. `api_key:<uuid>` or `user:<id>`.
    MemberAmountRequest:
      type: object
      required: [amount]
      properties:
        amount: { $ref: '#/components/schemas/Amount' }
        metadata: { $ref: '#/components/schemas/Metadata' }
        occurredAt:
          type: string
          format: date-time
          description: Optional event time for series bucketing (see AmountRequest.occurredAt).
    SubmitRequest:
      type: object
      required: [value]
      properties:
        value: { $ref: '#/components/schemas/Value' }
        mode: { $ref: '#/components/schemas/Mode' }
        metadata: { $ref: '#/components/schemas/Metadata' }
        occurredAt:
          type: string
          format: date-time
          description: Optional event time for series bucketing (see AmountRequest.occurredAt).
    MemberValue:
      type: object
      required: [key, member, memberValue, memberAccepted, mode, epoch]
      properties:
        key: { type: string }
        member: { type: string }
        memberValue: { $ref: '#/components/schemas/Value' }
        memberAccepted:
          type: boolean
          description: False when a min/max submit kept the standing best.
        mode: { $ref: '#/components/schemas/Mode' }
        epoch: { type: integer, format: int64 }
        value:
          $ref: '#/components/schemas/Value'
    MemberRemoved:
      type: object
      required: [key, member, epoch]
      properties:
        key: { type: string }
        member: { type: string }
        epoch: { type: integer, format: int64 }
        value:
          $ref: '#/components/schemas/Value'
    MemberSnapshot:
      type: object
      required: [key, member, value, rank, percentile, memberCount, mode, epoch, updatedAt]
      properties:
        key: { type: string }
        member: { type: string }
        value: { $ref: '#/components/schemas/Value' }
        metadata: { $ref: '#/components/schemas/Metadata' }
        rank: { type: integer, format: int64, description: 'Competition rank (ties share; next skips: 1,2,2,4).' }
        percentile:
          type: string
          pattern: '^-?[0-9]+\.[0-9]{2}$'
          description: Share of members at-or-behind, scale 2 (e.g. "83.33"); leader and sole member read "100.00".
        memberCount: { type: integer }
        mode: { $ref: '#/components/schemas/Mode' }
        epoch: { type: integer, format: int64 }
        updatedAt: { type: string, format: date-time }
    LeaderboardEntry:
      type: object
      required: [rank, member, value, updatedAt]
      properties:
        rank: { type: integer, format: int64 }
        member: { type: string }
        value: { $ref: '#/components/schemas/Value' }
        metadata: { $ref: '#/components/schemas/Metadata' }
        updatedAt: { type: string, format: date-time }
    Leaderboard:
      type: object
      required: [key, mode, epoch, order, memberCount, limit, offset, entries]
      properties:
        key: { type: string }
        mode: { $ref: '#/components/schemas/Mode' }
        epoch: { type: integer, format: int64 }
        order: { type: string, enum: [asc, desc] }
        total:
          $ref: '#/components/schemas/Value'
        memberCount: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        entries:
          type: array
          items: { $ref: '#/components/schemas/LeaderboardEntry' }
    Usage:
      type: object
      required: [month, ops, counters, limits]
      description: Current quota state for the organization (see GET /usage).
      properties:
        month: { type: string, description: 'UTC month, e.g. "2026-07".' }
        ops:
          type: object
          required: [used, resetsAt]
          properties:
            used: { type: integer, description: Write ops recorded this UTC month. }
            quota:
              type: [integer, 'null']
              description: Monthly op ceiling; null for unlimited plans.
            resetsAt:
              type: string
              format: date-time
              description: First instant of the next UTC month; present even when quota is null.
        counters:
          type: object
          required: [used, max]
          properties:
            used: { type: integer, description: Live (non-deleted) counters in the org. }
            max: { type: integer, description: Counter cap for the plan. }
        limits:
          type: object
          required: [rateLimitRps, maxCounters]
          properties:
            rateLimitRps: { type: integer }
            maxCounters: { type: integer }
            monthlyOpsQuota:
              type: [integer, 'null']
              description: Monthly op ceiling; null for unlimited plans.
    MemberSeriesResponse:
      type: object
      description: >-
        One member's per-bucket series (dimensional member series). On a sum board each point is the
        bucket's signed delta sum; on a score board it is the bucket-best (`min`/`max`) or bucket-latest
        (`latest`) value. Score-board points are sparse — an empty bucket means "no submission", not
        zero, and `gapfill=true` is rejected (400); clients wanting a running best compute a cumulative
        min/max over the sparse points client-side.
      required: [counterKey, member, bucket, mode, range, points]
      properties:
        counterKey: { type: string }
        member: { type: string }
        bucket: { type: string }
        mode:
          type: string
          enum: [delta, min, max, latest]
          description: >-
            The point value-type. `delta` on a sum board (per-bucket delta); on a score board the board
            mode (`min`/`max`/`latest`), telling clients how to read each bucket's value.
        tz: { type: string }
        range:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        points:
          type: array
          items: { $ref: '#/components/schemas/SeriesPoint' }
    MemberSeriesEntry:
      type: object
      required: [member, points]
      properties:
        member: { type: string }
        points:
          type: array
          items: { $ref: '#/components/schemas/SeriesPoint' }
    MemberGroupSeriesResponse:
      type: object
      description: >-
        Per-member multi-series (`groupBy=member`). Sum boards are gapfilled dense; score boards return
        sparse per-member point lists (same rule as the single-member score series — a gap is "no
        submission", not zero).
      required: [counterKey, bucket, mode, range, memberCount, selectedCount, truncated, series]
      properties:
        counterKey: { type: string }
        bucket: { type: string }
        mode:
          type: string
          enum: [delta, min, max, latest]
          description: >-
            The point value-type: `delta` on a sum board, else the board mode (`min`/`max`/`latest`).
        tz: { type: string }
        range:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        memberCount:
          type: integer
          minimum: 0
          description: >-
            Members with data in the requested range before top-N selection.
        selectedCount:
          type: integer
          minimum: 0
          description: >-
            Real member series selected into the response; excludes the synthetic `$other` series.
        truncated:
          type: boolean
          description: >-
            True when top-N selection omitted at least one range member.
        series:
          type: array
          items: { $ref: '#/components/schemas/MemberSeriesEntry' }
    WindowEntry:
      type: object
      required: [rank, member, value]
      properties:
        rank: { type: integer, format: int64 }
        member: { type: string }
        value: { $ref: '#/components/schemas/Value' }
    WindowLeaderboard:
      type: object
      description: >-
        Members ranked by their activity over a trailing window. Sum boards rank the window-sum; score
        boards rank the window-best (`min`/`max`) or window-latest (`latest`) value. Default `order`
        follows the board mode — `asc` for `min` (fastest-first), `desc` otherwise; an explicit `order`
        overrides. `total` is non-null on sum boards only (`null` on score boards, mirroring the
        all-time `Leaderboard`).
      required: [key, mode, window, order, memberCount, limit, offset, effectiveStart, effectiveEnd, entries]
      properties:
        key: { type: string }
        mode: { type: string, enum: [sum, min, max, latest] }
        window: { type: string, enum: ['1h', '6h', '12h', '1d', '7d', '30d'] }
        order: { type: string, enum: [asc, desc] }
        total:
          oneOf:
            - $ref: '#/components/schemas/Value'
            - type: 'null'
          description: Window group total (window sum of counter_rollup) — the value on sum boards, `null` on score boards.
        memberCount: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        effectiveStart:
          type: string
          format: date-time
          description: >-
            The effective lower bound actually summed, floored to the 1h member-rollup storage boundary
            so `entries` and `total` cover the identical range. May be earlier than `now − window`.
        effectiveEnd:
          type: string
          format: date-time
          description: The effective upper bound actually summed (the request instant).
        entries:
          type: array
          items: { $ref: '#/components/schemas/WindowEntry' }
    MachineAlertRule:
      type: object
      required: [ruleId, counterKey, targetType, name, kind, forChecks, checkIntervalSeconds, notifyOnResolve, channelId, channelIds, enabled, state, breaches, nextCheckAt, createdAt]
      description: An alert rule (machine surface response; mirrors the dashboard rule shape).
      properties:
        ruleId: { type: string, format: uuid }
        counterKey:
          type: string
          description: Target counter key — or the derived key for `derived` rules.
        targetType: { type: string, enum: [counter, member, derived] }
        derivedKey:
          type: [string, 'null']
          description: Echoes `counterKey` for `derived` rules; null otherwise.
        member:
          type: [string, 'null']
          description: The leaderboard member the rule scopes to (`member` targets only).
        name: { type: string }
        kind: { type: string, description: 'Alert condition kind (for example value_above or rate_change).' }
        threshold:
          type: [string, 'null']
          description: Integer string for counter rules; decimal string for derived rules.
        percent:
          type: [string, 'null']
          description: Decimal string for percentage kinds.
        direction: { type: [string, 'null'] }
        baseline: { type: [string, 'null'] }
        minBaseline: { type: [string, 'null'] }
        window: { type: [string, 'null'], description: Rate-window label for rate kinds. }
        forChecks: { type: integer }
        checkIntervalSeconds: { type: integer }
        notifyOnResolve: { type: boolean }
        reminderIntervalSeconds:
          type: ['integer', 'null']
          description: Re-notification interval while open; null means off.
        channelId: { type: string, format: uuid }
        channelIds:
          type: array
          items: { type: string, format: uuid }
        enabled: { type: boolean }
        state: { type: string, description: 'Live evaluator state (for example ok or firing).' }
        breaches: { type: integer }
        nextCheckAt: { type: string, format: date-time }
        lastCheckedAt: { type: [string, 'null'], format: date-time }
        lastObserved: { description: Raw JSON of what the evaluator last saw. }
        createdAt: { type: string, format: date-time }
    MachineAlertRuleList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/MachineAlertRule' }
        nextCursor:
          type: [string, 'null']
          description: Opaque cursor for the next page; null when exhausted.
    MachineAlertTargetType:
      type: string
      enum: [counter, member, derived]
      description: Which namespace the rule's key lives in.
    MachineCreateAlertRuleRequest:
      type: object
      required: [counterKey, kind]
      properties:
        targetType:
          allOf:
            - $ref: '#/components/schemas/MachineAlertTargetType'
          default: counter
        counterKey:
          type: string
          minLength: 1
          maxLength: 200
          description: Target counter key — or an existing derived key for `derived` rules.
        member:
          type: [string, 'null']
          description: Required exactly for `member` targets; forbidden otherwise.
        kind: { type: string, description: 'Alert condition kind (for example value_above or rate_change).' }
        name: { type: string, maxLength: 200 }
        threshold: { type: string, description: Integer string (counter) or decimal string (derived). }
        percent: { type: string }
        direction: { type: string }
        baseline: { type: string }
        minBaseline: { type: string }
        window: { type: string, description: Rate-window label for rate kinds. }
        forChecks: { type: integer }
        checkIntervalSeconds: { type: integer }
        notifyOnResolve: { type: boolean }
        reminderIntervalSeconds:
          type: ['integer', 'null']
          description: Omit or null for off.
        channelId: { type: string, format: uuid }
        channelIds:
          type: array
          items: { type: string, format: uuid }
        enabled: { type: boolean }
    MachineUpdateAlertRuleRequest:
      type: object
      description: |
        Partial update; kind, key, and target are immutable. Reminder semantics are tri-state: omit
        to leave unchanged, null to turn off, a value to set.
      properties:
        name: { type: string, maxLength: 200 }
        threshold: { type: string }
        percent: { type: string }
        direction: { type: string }
        baseline: { type: string }
        minBaseline: { type: string }
        window: { type: string }
        forChecks: { type: integer }
        checkIntervalSeconds: { type: integer }
        notifyOnResolve: { type: boolean }
        reminderIntervalSeconds: { type: ['integer', 'null'] }
        channelId: { type: string, format: uuid }
        channelIds:
          type: array
          items: { type: string, format: uuid }
        enabled: { type: boolean }
    MachineAlertIncident:
      type: object
      required: [incidentId, ruleId, openedAt, openContext]
      properties:
        incidentId: { type: string, format: uuid }
        ruleId: { type: string, format: uuid }
        openedAt: { type: string, format: date-time }
        acknowledgedAt: { type: [string, 'null'], format: date-time }
        acknowledgedBy: { type: [string, 'null'] }
        resolvedAt: { type: [string, 'null'], format: date-time }
        openContext: { description: Raw JSON of the breaching observation. }
        resolveContext: { description: 'Raw JSON of the resolving observation, when resolved.' }
    MachineAckRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Required free-text reason, kept in the audit trail. No confirmation word.
    MachineMintKeyRequest:
      type: object
      required: [name, scopes]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Display name for the minted key (1–120 bytes, no control characters).
        scopes:
          type: array
          minItems: 1
          items:
            type: string
          description: |
            The minted key's scope set — every entry must name a scope in the API-key vocabulary,
            and every entry must already be on the calling key (no escalation). `key:mint` may be
            included only when the caller carries it.
        expiresAt:
          type: string
          format: date-time
          description: |
            Optional RFC 3339 expiry; must be a future instant, and must not be later than the
            calling key's own expiry (rejected with `400`, never clamped). Null (absent) means
            the minted key never expires (allowed only when the calling key itself never expires).
    MachineMintKeyResponse:
      type: object
      required: [id, name, scopes]
      properties:
        id:
          type: string
          format: uuid
          description: The minted key's id.
        name:
          type: string
          description: The minted key's display name.
        scopes:
          type: array
          items:
            type: string
          description: The minted key's scope set, sorted.
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: The minted key's expiry, second resolution; null means it never expires.
        createdByKeyId:
          type: [string, 'null']
          format: uuid
          description: |
            Lineage — the id of the key that minted this one. Informational only: revoking the
            minting key does not cascade.
        secret:
          type: [string, 'null']
          description: |
            The new key's secret (`sk_live_...`), shown exactly once on the initial `201`. An
            idempotent replay (`200`) returns null — the plaintext is stored nowhere and cannot
            be re-served. The response carries `Cache-Control: private, no-store`.
    KeyMintDeniedProblem:
      description: |
        A key-mint escalation (403) problem. `type` is always `scope_denied`; `disallowed` names
        every requested scope outside the calling key's own set (sorted). Echoing these is safe:
        they are caller-supplied request members, never the key's own scope set.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [type, title, status, disallowed]
          properties:
            disallowed:
              type: array
              items:
                type: string
    MachineCommandPending:
      type: object
      required: [commandId, correlationId]
      description: Split-hub acknowledgement accepted but not yet applied; retry the ack or poll the incident.
      properties:
        commandId: { type: string, format: uuid }
        correlationId: { type: string, format: uuid }
    MachineDerivedDefinition:
      type: object
      required: [derivedKey, expression, scale, refs, createdAt, updatedAt]
      description: A named expression over the organization's counters.
      properties:
        derivedKey: { type: string }
        expression: { type: string }
        scale: { type: integer }
        refs:
          type: array
          items: { type: string }
          description: Counter keys the expression references.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MachineDerivedDefinitionList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/MachineDerivedDefinition' }
        nextCursor:
          type: [string, 'null']
          description: Opaque cursor for the next page; null when exhausted.
    MachineCreateDerivedDefinitionRequest:
      type: object
      required: [derivedKey, expression]
      properties:
        derivedKey:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[A-Za-z0-9._:-]+$'
        expression: { type: string, description: Expression over counters (e.g. "c('a') / c('b')"). }
        scale: { type: integer, description: Decimal scale; defaults server-side when omitted. }
    MachineUpdateDerivedDefinitionRequest:
      type: object
      description: At least one of expression/scale is required.
      properties:
        expression: { type: string }
        scale: { type: integer }
    Problem:
      type: object
      description: Error details, per RFC 9457 (application/problem+json).
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
    QuotaProblem:
      description: |
        A quota (403) problem. Extends Problem with RFC 9457 extension members telling a machine caller
        exactly where it stands. Members are optional — old Problem consumers keep parsing these bodies.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            limit: { type: integer, description: The entitlement ceiling that was hit. }
            used: { type: integer, description: Current usage against that ceiling. }
            resetsAt:
              type: string
              format: date-time
              description: When the usage resets (time-windowed quotas only, e.g. monthly ops).
    PlaneConfigStale:
      type: object
      required: [error, reason]
      description: |
        A production plane cannot prove that its committed config snapshot is fresh enough to admit
        a dashboard read. Retry after the `Retry-After` delay; the hub must refresh the plane snapshot
        before the plane serves more projection-bound dashboard reads.
      properties:
        error:
          type: string
          const: plane_config_stale
        reason:
          type: string
          description: Machine-readable stale-config reason, for example `no_committed_snapshot`.
        seconds_since_hub_contact:
          type: [integer, 'null']
          description: Seconds since the last accepted hub contact when known; omitted or null when unknown.
    DashboardEntitlementsStale:
      type: object
      required: [error]
      properties:
        error:
          type: string
          const: plane_config_stale

  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing, invalid, or expired API key (an expired key is indistinguishable from an unknown one).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Counter not found.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: |
        The request exceeds the plan's entitlements, or the credential lacks full access, or — once
        scope enforcement is enforced for the organization — the API key lacks the operation's required
        scope (`x-api-key-scope`). A scope denial is a Problem body with `type: "scope_denied"`, the
        HTTP `status`, a human-readable `title`, and an additional `required` string member naming the
        required scope (e.g. `{"type":"scope_denied","title":"missing required scope:
        counter:manage","status":403,"required":"counter:manage"}`); the key's own scope set is never
        echoed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    QuotaExceeded:
      description: >-
        A plan-derived limit was reached (e.g. maximum counters, monthly ops quota, or the live idempotency-key cap).
        Idempotency-cap responses do not include Retry-After; retry only after older keys leave the six-hour window.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/QuotaProblem' }
    RateLimited:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    DashboardReadUnavailable:
      description: The target plane cannot currently serve projection-bound dashboard reads.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlaneConfigStale' }
    DashboardEntitlementsUnavailable:
      description: >-
        The plane has no applied config snapshot, or the caller's organization is absent from it; retry
        once the plane's snapshot is current.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DashboardEntitlementsStale' }
    PreconditionFailed:
      description: An optimistic-concurrency precondition failed (a stale `If-Match` revision).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: The request body exceeds the endpoint's size ceiling.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: |
        A state precondition was not met. Stable cases include:

        - `urn:counters:problem:counter-not-declared`: the organization's
          `undeclaredCounterWrites` policy is `reject` and an ordinary write targeted an absent key;
          declare it with `POST /counters` before retrying.
        - a bulk declaration's desired settings do not match existing counter state; the entire
          declaration request was rolled back.
        - `urn:counters:problem:counter-epoch-mismatch`: `expectedEpoch` differs from the counter's
          current epoch.
        - an `Idempotency-Key` was first used for a different operation; retry with a fresh key (or
          the operation the key belongs to).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
